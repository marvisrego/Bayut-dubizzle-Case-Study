[project]
name = "dubizzle-cars-assistant"
version = "0.1.0"
description = "Canonical inventory ingestion and semantic retrieval for the Dubizzle car assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "filelock>=3.16,<4",
    "httpx>=0.27,<1",
    "openpyxl>=3.1,<4",
    "psycopg2-binary>=2.9,<3",
    "python-dotenv>=1,<2",
    "qdrant-client>=1.12,<2",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.50,<2",
    "tzdata>=2025.1",
    "uvicorn>=0.30,<1",
]

[tool.uv]
package = false
